<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Reset Password — {$site_name|escape}</title>
	<link rel="stylesheet" href="{$url_admin_real}css/vars.css">
	<style>
		*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

		body {
			font-family: var(--nc-font);
			background: var(--nc-bg-page);
			min-height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 2rem;
		}

		#login-box {
			background: var(--nc-bg);
			border: 1px solid var(--nc-border);
			box-shadow: var(--nc-box-shadow);
			border-radius: var(--nc-radius-lg);
			width: 100%;
			max-width: 380px;
			overflow: hidden;
		}

		#login-header {
			background: var(--nc-topbar-bg);
			color: var(--nc-topbar-text);
			padding: 1.5rem 2rem;
			text-align: center;
		}

		#login-header h1 {
			font-size: 1.1rem;
			font-weight: 600;
			opacity: .75;
			margin-bottom: .2rem;
			text-transform: uppercase;
			letter-spacing: .08em;
		}

		#login-header .store-name {
			font-size: 1.4rem;
			font-weight: 700;
		}

		#login-form { padding: 2rem; }

		.field { margin-bottom: 1rem; }
		.field label {
			display: block;
			font-size: .85rem;
			font-weight: 600;
			color: var(--nc-text);
			margin-bottom: .3rem;
		}
		.field input {
			width: 100%;
			padding: .55rem .75rem;
			border: 1px solid var(--nc-border);
			border-radius: var(--nc-radius);
			font-size: .95rem;
			color: var(--nc-text);
			background: var(--nc-bg);
			outline: none;
			transition: border-color .15s, box-shadow .15s;
		}
		.field input:focus {
			border-color: var(--nc-border-focus);
			box-shadow: var(--nc-focus-shadow);
		}
		.field small { display: block; margin-top: .25rem; color: var(--nc-text-dim); font-size: .78rem; }

		.error-msg {
			background: color-mix(in srgb, var(--nc-danger) 12%, #fff);
			color: var(--nc-danger);
			border-radius: var(--nc-radius);
			padding: .6rem .85rem;
			font-size: .87rem;
			font-weight: 500;
			margin-bottom: 1rem;
		}
		.error-msg a { color: inherit; text-decoration: underline; }

		button[type=submit] {
			width: 100%;
			padding: .6rem;
			background: var(--nc-primary);
			color: var(--nc-primary-text);
			border: none;
			border-radius: var(--nc-radius);
			font-size: .95rem;
			font-weight: 600;
			cursor: pointer;
			transition: filter .15s;
			margin-top: .5rem;
		}
		button[type=submit]:hover { filter: brightness(.9); }

		.back-link {
			display: block;
			text-align: center;
			margin-top: 1.25rem;
			font-size: .85rem;
			color: var(--nc-text-dim);
			text-decoration: none;
		}
		.back-link:hover { color: var(--nc-primary); }

		#login-footer {
			text-align: center;
			padding: .85rem;
			font-size: .75rem;
			color: var(--nc-text-dim);
			border-top: 1px solid var(--nc-border-light);
		}
	</style>
</head>
<body>

<div id="login-box">
	<div id="login-header">
		<h1>Admin</h1>
		<div class="store-name">{$site_name|escape}</div>
	</div>
	<div id="login-form">
		{if $error}
		<div class="error-msg">{$error nofilter}</div>
		{/if}

		{if $valid_token}
		<form method="post" action="{$url_admin}?route=reset-password">
			<input type="hidden" name="csrf_token" value="{$csrf_token|escape}">
			<input type="hidden" name="token" value="{$token|escape}">
			<div class="field">
				<label for="password">New Password</label>
				<input type="password" id="password" name="password" required autocomplete="new-password" autofocus>
				<small>Minimum 8 characters</small>
			</div>
			<div class="field">
				<label for="password_confirm">Confirm Password</label>
				<input type="password" id="password_confirm" name="password_confirm" required autocomplete="new-password">
			</div>
			<button type="submit">Reset Password</button>
		</form>
		{/if}

		<a class="back-link" href="{$url_admin}?route=login">Back to Login</a>
	</div>
	<div id="login-footer">
		{$ec_name} &mdash; &copy; {$smarty.now|date_format:'%Y'} {$ec_company|escape}
	</div>
</div>

</body>
</html>
