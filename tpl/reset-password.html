{extends file="layout.html"}

{block name="title"}Reset Password — {$site_name}{/block}

{block name="content"}
<div class="page-head">
	<h1>Reset Your Password</h1>
</div>

<div class="page-content" style="max-width: 500px; margin: 2rem auto;">
	{if $error}
	<div style="background: #fee2e2; color: #7f1d1d; border-radius: 0.375rem; padding: 0.75rem 1rem; margin-bottom: 1.5rem; border-left: 4px solid #dc2626;">
		{$error nofilter}
	</div>
	{/if}

	{if $valid_token}
	<form method="post" action="{$url_root}?route=reset-password" style="display: flex; flex-direction: column; gap: 1.25rem;">
		<input type="hidden" name="csrf_token" value="{$csrf_token|escape}">
		<input type="hidden" name="token" value="{$token|escape}">

		<div>
			<label for="password" style="display: block; font-weight: 600; margin-bottom: 0.5rem; color: var(--nc-text);">New Password</label>
			<input type="password" id="password" name="password" required autocomplete="new-password" autofocus
			       style="width: 100%; padding: 0.6rem 0.75rem; border: 1px solid var(--nc-border); border-radius: 0.375rem; font-size: 1rem; color: var(--nc-text); background: var(--nc-bg);">
			<small style="color: var(--nc-text-dim); display: block; margin-top: 0.25rem;">Minimum 8 characters</small>
		</div>

		<div>
			<label for="password_confirm" style="display: block; font-weight: 600; margin-bottom: 0.5rem; color: var(--nc-text);">Confirm Password</label>
			<input type="password" id="password_confirm" name="password_confirm" required autocomplete="new-password"
			       style="width: 100%; padding: 0.6rem 0.75rem; border: 1px solid var(--nc-border); border-radius: 0.375rem; font-size: 1rem; color: var(--nc-text); background: var(--nc-bg);">
		</div>

		<button type="submit" style="padding: 0.75rem 1.5rem; background: var(--nc-primary); color: white; border: none; border-radius: 0.375rem; font-size: 1rem; font-weight: 600; cursor: pointer; margin-top: 0.5rem;">
			Reset Password
		</button>
	</form>
	{/if}

	<div style="text-align: center; margin-top: 1.5rem;">
		<a href="{$url_root}?route=login" style="color: var(--nc-border-focus); text-decoration: none;">Back to Login</a>
	</div>
</div>
{/block}
